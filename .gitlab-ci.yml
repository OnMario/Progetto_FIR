stages:
  - setup
  - simulate
  - test

variables:
  VIVADO_EXEC: "C:\\AMDDesignTools\\2025.2\\Vivado\\bin\\vivado.bat"
  GIT_CLEAN_FLAGS: none

# --- STEP 1: Project ---
recreate_project:
  stage: setup
  tags:
    - fpga-arty-a7
  script:
    - echo "Project Reconstruction & IP Generation"
    - '& $env:VIVADO_EXEC -mode batch -source scripts/recreate_project.tcl'

# --- STEP 2: RTL simulation ---
rtl_simulation:
  stage: simulate
  tags:
    - fpga-arty-a7
  script:
    - echo "RTL Simulation"
    - '& $env:VIVADO_EXEC -mode batch -source scripts/run_sim.tcl'

# --- STEP 3: HIL Test e Report ---
hil_test:
  stage: test
  tags:
    - fpga-arty-a7
  script:
    - echo "Hardware-in-the-Loop Test"
    - '& $env:VIVADO_EXEC -mode batch -source scripts/hil_test.tcl'
  artifacts:
    when: always
    reports:
      junit: hil_report.xml